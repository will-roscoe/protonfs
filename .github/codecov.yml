# Generated by ghtools from .github/ghtools.toml ([ci.coverage]); edit that, then run
# `ghtools codecov --write`. Defaults: https://github.com/will-roscoe/.ghtools
codecov:
  require_ci_to_pass: true
coverage:
  precision: 2
  round: down
  range: 70...95
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        informational: true
comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
ignore:
  - tests/**
  - docs/**
